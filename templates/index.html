<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>ASL Recognition</title>
    <style>
        body { font-family: Arial; text-align: center; margin-top: 50px; background: #fafafa; }
        img, video { max-width: 400px; margin-top: 20px; border-radius: 10px; box-shadow: 0 2px 10px #ccc; }
        .upload-box { border: 2px dashed #aaa; padding: 25px; width: 50%; margin: auto; border-radius: 10px; background: white; }
        h1 { color: #222; }
        button { background-color: #0066cc; color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; }
        button:hover { background-color: #004c99; }
    </style>
</head>
<body>
    <h1>🤖 نظام التعرف على لغة الإشارة</h1>
    <div class="upload-box">
        <form action="/predict" method="POST" enctype="multipart/form-data">
            <input type="file" name="file" accept="image/*,video/*" required><br><br>
            <button type="submit">تحليل الملف</button>
        </form>
    </div>

    {% if prediction %}
        <h2>النتيجة: {{ prediction }}</h2>
        {% if confidence %}
            <p>الدقة: {{ confidence }}%</p>
        {% endif %}
        {% if image_path.endswith('.mp4') %}
            <video controls>
                <source src="{{ image_path }}" type="video/mp4">
            </video>
        {% else %}
            <img src="{{ image_path }}" alt="Uploaded Image">
        {% endif %}
    {% endif %}
</body>
</html>
